version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel-crm
      MYSQL_USER: krayin
      MYSQL_PASSWORD: krayin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    image: webdevops/php-nginx:8.2
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:80"
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
